spring:
  application:
    name: kline-proxy
server:
  port: 1888
management:
  endpoint:
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  metrics:
    tags:
      application: ${spring.application.name}
number:
  type: double
kline:
  persistence:
    enabled: false
    loadOnStartup: true
    dumpOnShutdown: true
    dumpIntervalSeconds: 300
    rootDir: ./data/kline-cache
    spot:
      intervalConfigs:
        "1h":
          # default is minMaintainCount * 2 when omitted
          maxStoreCount: 18000
          symbolMaxStoreCounts:
            BTCUSDT: 20000
    future:
      intervalConfigs:
        "1h":
          # default is minMaintainCount * 2 when omitted
          maxStoreCount: 2000
  binance:
    spot:
      intervalSyncConfigs:
        "1h":
          minMaintainCount: 9000
          listenSymbolPatterns:
            - .*?USDT
        "1d":
          minMaintainCount: 1000
          listenSymbolPatterns:
            - .*?USDT
    future:
      intervalSyncConfigs:
        "1h":
          minMaintainCount: 9000
          listenSymbolPatterns:
            - .*?USDT
        "1d":
          minMaintainCount: 1000
          listenSymbolPatterns:
            - .*?USDT

client:
  binanceSpot:
    api:
      rootUrl: https://api.binance.com
  binanceFuture:
    api:
      rootUrl: https://fapi.binance.com

ws:
  client:
    binanceSpot:
      url: wss://stream.binance.com/ws
    binanceFuture:
      url: wss://fstream.binance.com/market/ws

# 1.7.14: bulk closed-bar finality wait (see update.md). Dotted keys on purpose: `kline:` and
# `server:` already exist above and YAML forbids duplicate root keys.
kline.bulk.finalWaitEnabled: true
kline.bulk.finalWaitMaxMs: 8000
# ~300 fleet requests block together at the boundary while a third-party tenant sends ~40 req/s.
# The embedded server is UNDERTOW (starter-undertow; tomcat excluded): default worker threads = 8 × CPUs (16 on the VPS).
server.undertow.threads.worker: 400
server.undertow.threads.io: 4
