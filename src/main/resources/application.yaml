spring:
  application:
    name: kline-proxy
server:
  port: 1888
management:
  endpoint:
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  metrics:
    tags:
      application: ${spring.application.name}
number:
  type: double
kline:
  diagnostics:
    closedBarLatencyEnabled: true
  persistence:
    enabled: false
    loadOnStartup: true
    dumpOnShutdown: true
    dumpIntervalSeconds: 300
    rootDir: ./data/kline-cache
    spot:
      intervalConfigs:
        "1h":
          # default is minMaintainCount * 2 when omitted
          maxStoreCount: 18000
          symbolMaxStoreCounts:
            BTCUSDT: 20000
    future:
      intervalConfigs:
        "1h":
          # default is minMaintainCount * 2 when omitted
          maxStoreCount: 2000
  binance:
    spot:
      intervalSyncConfigs:
        "1h":
          minMaintainCount: 9000
          listenSymbolPatterns:
            - .*?USDT
        "1d":
          minMaintainCount: 1000
          listenSymbolPatterns:
            - .*?USDT
    future:
      intervalSyncConfigs:
        "1h":
          minMaintainCount: 9000
          # true selects continuous-contract klines for perpetual futures
          useContinuousKlineStream: false
          listenSymbolPatterns:
            - .*?USDT
        "1d":
          minMaintainCount: 1000
          useContinuousKlineStream: false
          listenSymbolPatterns:
            - .*?USDT

client:
  binanceSpot:
    api:
      rootUrl: https://api.binance.com
  binanceFuture:
    api:
      rootUrl: https://fapi.binance.com

ws:
  client:
    binanceSpot:
      url: wss://stream.binance.com/ws
    binanceFuture:
      url: wss://fstream.binance.com/market/ws

# 1.7.14: bulk closed-bar finality wait (see update.md). Dotted keys on purpose: `kline:` and
# `server:` already exist above and YAML forbids duplicate root keys.
kline.bulk.finalWaitEnabled: true
kline.bulk.finalWaitMaxMs: 8000
# ~300 fleet requests block together at the boundary while a third-party tenant sends ~40 req/s.
# 1.8.0: the container is TOMCAT again (the undertow starter is gone, the tomcat exclusion with it).
# The swap exists only so `spring.threads.virtual.enabled` can be used: Spring Boot's virtual-thread
# support covers Tomcat and Jetty, not Undertow — measured 2026-09-09, a real-server test showed
# requests still landing on `XNIO-N task-M` with every Undertow hook tried.
#
# Keep this at/above the number of requests that block together at the boundary. With platform
# threads that is a hard cap: 289 fleet requests wait ~2.4 s each for the closed bar, so Tomcat's
# default 200 would queue a third of the fleet behind the settle. Once virtual threads are on the
# cap stops mattering, but it stays here as the fallback the flag can be turned off to.
server.tomcat.threads.max: 400
# Off on purpose for the first release: the container swap and the threading model are separate
# risks and should fail separately. Flip to true only after a cycle has run green on Tomcat.
spring.threads.virtual.enabled: false
